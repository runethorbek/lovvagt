name: Task
description: A single, implementable unit of work. One task, one branch, one pull request.
labels: ["type:task"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done and why.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Verifiable conditions. Each must be checkable when the task is done.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues that must be done first, or "None".
      placeholder: "None"
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
    validations:
      required: true
  - type: textarea
    id: agent-notes
    attributes:
      label: Notes for the agent
      description: Pointers, constraints or hints that are not obvious from CLAUDE.md or the spec.
    validations:
      required: false
